<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2836"/>
      <stop offset="1" stop-color="#0b0f15"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- road / GPS track -->
  <path d="M40 452 C150 392 300 470 472 396" fill="none" stroke="url(#acc)" stroke-width="16" stroke-linecap="round" stroke-dasharray="2 30"/>
  <!-- location pin -->
  <g transform="translate(392 92)">
    <path d="M0 0 C-30 0 -46 22 -46 44 C-46 74 0 112 0 112 C0 112 46 74 46 44 C46 22 30 0 0 0 Z" fill="url(#acc)"/>
    <circle cx="0" cy="44" r="17" fill="#121821"/>
  </g>
  <!-- speed lines -->
  <g stroke="#ff9a2a" stroke-width="12" stroke-linecap="round" opacity=".85">
    <line x1="34" y1="228" x2="92" y2="228"/>
    <line x1="52" y1="262" x2="104" y2="262"/>
    <line x1="34" y1="296" x2="80" y2="296"/>
  </g>
  <!-- motorcycle -->
  <g fill="none" stroke="#f3f5f8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="148" cy="340" r="58" stroke-width="22"/>
    <circle cx="378" cy="340" r="58" stroke-width="22"/>
  </g>
  <circle cx="148" cy="340" r="12" fill="#f3f5f8"/>
  <circle cx="378" cy="340" r="12" fill="#f3f5f8"/>
  <g fill="#f3f5f8" stroke="#f3f5f8" stroke-linejoin="round" stroke-linecap="round">
    <!-- swingarm -->
    <path d="M148 340 L238 306" stroke-width="18" fill="none"/>
    <!-- engine -->
    <path d="M214 270 L286 270 L298 318 L236 330 L206 300 Z" stroke-width="8"/>
    <!-- tank -->
    <path d="M206 262 C214 226 252 212 300 216 L332 228 L312 262 Z" stroke-width="10"/>
    <!-- seat + tail -->
    <path d="M118 236 L150 232 L206 246 L206 266 L140 262 Z" stroke-width="10"/>
    <!-- front fork -->
    <path d="M326 214 L378 340" stroke-width="18" fill="none"/>
    <!-- handlebar -->
    <path d="M312 196 L352 186" stroke-width="16" fill="none"/>
    <!-- exhaust -->
    <path d="M232 334 L178 312" stroke-width="12" fill="none"/>
  </g>
  <!-- headlight -->
  <circle cx="348" cy="236" r="14" fill="url(#acc)"/>
</svg>
